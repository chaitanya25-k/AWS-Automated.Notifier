AWSTemplateFormatVersion: '2010-09-09'
Description: 'Serverless Event-Driven File Notifier Architecture'

Resources:
  # 1. Create the SNS Topic
  FileAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: FileAlertTopic

  # 2. Create the IAM Role for Lambda
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonSNSFullAccess

  # 3. Create the S3 Bucket
  UploadBucket:
    Type: AWS::S3::Bucket
    DependsOn: LambdaInvokePermission
    Properties:
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ProcessFileFunction.Arn

  # 4. Give S3 Permission to trigger Lambda
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProcessFileFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # 5. The Lambda Function
  ProcessFileFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.9
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref FileAlertTopic
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import urllib.parse
          
          sns_client = boto3.client('sns')
          # Automatically pulls the ARN created by CloudFormation
          SNS_TOPIC_ARN = os.environ['SNS_TOPIC_ARN']
          
          def lambda_handler(event, context):
              bucket = event['Records'][0]['s3']['bucket']['name']
              key = urllib.parse.unquote_plus(event['Records'][0]['s3']['object']['key'], encoding='utf-8')
              message_text = f"Success! A new file named '{key}' was just uploaded to '{bucket}'."
              sns_client.publish(TopicArn=SNS_TOPIC_ARN, Message=message_text, Subject='Cloud Alert')
              return {'statusCode': 200, 'body': json.dumps('Notification sent!')}
